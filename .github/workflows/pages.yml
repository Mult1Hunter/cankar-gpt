# Deploy the static landing page (apps/landing-page/) to GitHub Pages.
# Pages `build_type` must be `workflow`, not `legacy` (branch/folder) - that is a
# GitHub *settings* value, not repo state, so the deploy cannot be reproduced from
# this file alone. Folder mode only publishes / or /docs, which is why the site is
# not constrained to either. `.nojekyll` is deliberately absent: the Actions
# artifact is served as-is and Jekyll never runs.
# Actions-based deploy (not "deploy from a branch") so the source can be any
# folder - folder-based Pages only allows / or /docs (ADR 0019).
name: pages

on:
  push:
    branches: [main]
    paths:
      - "apps/landing-page/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; do not cancel an in-flight production deploy.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/landing-page
      - id: deployment
        uses: actions/deploy-pages@v4
